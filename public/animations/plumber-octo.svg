  <!-- Vector overlay for animation reference: this file is a raster-in-SVG wrapper.
       True limb animation uses the CatRig vector plumber (cat-rig.js theme:plumber)
       which reuses the same CAT_D geometry with Mario colors (red hat #e53935,
       blue overalls #1565c0, white gloves, brown shoes, green mushroom). The JPEG
       is kept as original asset; no potrace vectorization needed for rig-based
       animation because the rig's paths are already vector. -->
</svg>
